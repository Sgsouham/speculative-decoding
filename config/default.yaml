# M0 scaffold — Repo 02 speculative-decoding
# Full build plan: ../plan.md (§4 targets/workloads, §7 benchmark methodology)

# Active selection — switch with one line (drop-in requirement, §2).
# Any draft in `models.drafts` pairs with any target in `models.targets`:
# the Qwen2.5/Qwen3 families share one tokenizer (151,669 vocab) — no cross-tokenizer mapping.
model:
  draft: qwen2.5-0.5b     # active draft alias
  target: qwen2.5-1.5b    # active target alias

runtime:
  dtype: fp16             # both models in fp16 (12 GB VRAM budget; Qwen3-4B pair ~9 GB)
  device: cuda            # GPU work only in WSL2 Ubuntu
  # transformers 5.x hub kernels (USE_HUB_KERNELS, default YES) are pinned OFF
  # in src/__init__.py + tests/conftest.py — network-independent, reproducible
  # benchmarks. Override with USE_HUB_KERNELS=YES if ever needed.

models:
  drafts:
    qwen2.5-0.5b: Qwen/Qwen2.5-0.5B-Instruct
    qwen3-0.6b:   Qwen/Qwen3-0.6B              # Qwen3 chat = no -Instruct suffix; thinking mode must be disabled
  targets:
    qwen2.5-1.5b: Qwen/Qwen2.5-1.5B-Instruct   # already cached in WSL2 (Repo 01)
    qwen2.5-3b:   Qwen/Qwen2.5-3B-Instruct
    qwen3-4b:     Qwen/Qwen3-4B                # Qwen3 chat = no -Instruct suffix; thinking mode must be disabled

decode:
  draft_length: 4       # k candidate tokens proposed per step
  temperature: 0.0      # 0.0 = greedy; > 0 = sampled (exercises resample path)
  max_new_tokens: 128   # default decode length for equivalence tests
  seed: 42              # fixed seed -> reproducible equivalence comparisons

benchmark:
  model_pairs:          # sweep these (draft, target) pairs — cross product by default
    drafts: [qwen2.5-0.5b, qwen3-0.6b]
    targets: [qwen2.5-1.5b, qwen2.5-3b, qwen3-4b]
  sweep:                # §7: per-pair 36-config sweep
    prompt_lengths: [32, 128, 512]
    draft_lengths: [3, 4, 5, 8]
    temperatures: [0.0, 0.7, 1.0]
    decode_lengths: [64, 128, 256]
  timing:
    warmup: 3           # full-model runs: warmup 3 / reps 5 (Repo 01 discipline)
    reps: 5
    unit_reps: 50       # per-op (accept/reject math) benches get >= 50 reps
  metrics: [decode_tok_s, acceptance_rate, ms_per_token, e2e_tok_s, peak_vram_mb]
  output_dir: results

oracle:
  hf_assistant_model: true   # §6.3 — transformers generate(assistant_model=...) as 3rd reference
