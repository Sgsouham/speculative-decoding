[project]
name = "speculative-decoding"
version = "0.1.0"
description = "Vanilla speculative decoding from scratch — Repo 02 of the model-optimization suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "pyarrow>=25.0.0",
    "tensorboard>=2.21.0",
    "torch>=2.13.0",
    "transformers==5.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
